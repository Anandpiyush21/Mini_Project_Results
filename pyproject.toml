[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emnist-rnn"
version = "1.0.0"
description = "A controlled comparison of five recurrent architectures on EMNIST-Balanced"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "tensorflow>=2.16",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "jupyterlab>=4.0"]

[tool.setuptools.packages.find]
include = ["emnist_rnn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
